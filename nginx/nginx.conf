events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend {
        server backend:8000;
    }

    # Real IP resolution (trust X-Forwarded-For from Docker network)
    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.0.0.0/8;  # Docker subnet

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth:10m rate=12r/m;
    limit_req_zone $binary_remote_addr zone=info:10m rate=120r/m;  # Increased for load testing (100 users)

    server {
        listen 80;
        server_name _;

        # WebSocket upgrade support
        location /api/v1/admin/auth/ws {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Rate-limited auth endpoints (strict)
        location /api/v1/auth/verify {
            # Disabled for load testing — re-enable for production
            # limit_req zone=auth burst=5 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Rate-limited info endpoints (challenge, ping)
        location /api/v1/auth/challenge {
            # Disabled for load testing — re-enable for production
            # limit_req zone=info burst=20 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/auth/ping {
            # Disabled for load testing — re-enable for production
            # limit_req zone=info burst=20 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # All other API routes
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Serve static frontend pages
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}

